name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run --locked ruff check src tests scripts
      - run: uv run --locked ruff format --check src tests scripts

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run --locked pytest -q
      - name: Build and verify wheel
        run: |
          uv build
          uv run --locked python scripts/verify_wheel.py dist/harbor_proximus-*.whl

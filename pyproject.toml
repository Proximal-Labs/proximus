[project]
name = "harbor-proximus"
version = "0.1.0a1"
description = "Proximus: a long-horizon coding agent for upstream Harbor."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
    "harbor==0.23.0",
    "litellm>=1.97.0,<2",
    "pydantic>=2.11.7,<3",
    "tenacity>=9.1.2,<10",
    "pillow>=10",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harbor_proximus"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/scripts", "/examples", "/README.md", "/AGENTS.md", "/pyproject.toml", "/LICENSE", "/NOTICE", "/uv.lock"]

[dependency-groups]
dev = ["pytest>=8.4.2", "pytest-asyncio>=1.2", "ruff>=0.15.17", "pillow>=10", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["unit: offline unit tests"]
addopts = "--strict-markers --strict-config"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
